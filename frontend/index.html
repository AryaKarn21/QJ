<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- tailwind.config.js already declares `sans: ['Inter', 'sans-serif']`
         as the app's font stack, but nothing ever loaded the actual
         webfont — every `font-sans`/default-body element has been
         silently rendering in the system font fallback since day one.
         Loading it here fixes typography app-wide, not just the hero. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
